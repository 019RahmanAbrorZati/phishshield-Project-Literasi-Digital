<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Portal Berita Aman</title>
</head>
<body>
  <header>
    <h1>Berita Terkini Hari Ini</h1>
  </header>
  <main>
    <article>
      <h2>Perkembangan Literasi Digital</h2>
      <p>Masyarakat semakin sadar akan pentingnya memeriksa tautan web.</p>
    </article>
    <!-- Form pencarian internal yang aman -->
    <form action="/cari" method="GET">
      <input type="text" name="q" placeholder="Cari berita...">
      <button type="submit">Cari</button>
    </form>
    <!-- Iframe video biasa dengan ukuran normal -->
    <iframe src="https://example.com/embed/video" width="560" height="315"></iframe>
  </main>
</body>
</html>
